name: langchain-azure-agent-hitl-middleware-responses
description: >
  A Foundry-hosted LangChain agent demonstrating HumanInTheLoopMiddleware
  batch decisions over the Responses protocol.
metadata:
  tags:
    - LangChain
    - LangGraph
    - Foundry Hosted Agent
    - Responses Protocol
    - HITL
    - Middleware
template:
  name: langchain-azure-agent-hitl-middleware-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-4.1-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
